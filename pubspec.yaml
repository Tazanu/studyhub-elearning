name: peer_to_peer_e_learning_app
description: "A Peer-to-Peer e-Learning Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.4.9

  # Navigation
  go_router: ^13.0.0

  # UI
  flutter_screenutil: ^5.9.0
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  google_fonts: ^6.1.0

  # Firebase
  firebase_core: ^2.27.1
  firebase_auth: ^4.19.6
  cloud_firestore: ^4.17.3
  firebase_storage: ^11.7.4
  firebase_messaging: ^14.9.4
  firebase_analytics: ^10.10.6
  firebase_crashlytics: ^3.5.4

  # Google Sign In
  google_sign_in: ^6.2.1

  # Local Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # HTTP
  dio: ^5.4.0

  # File Handling
  image_picker: ^1.0.7
  file_picker: ^6.1.1
  path_provider: ^2.1.2

  # Utilities
  intl: ^0.19.0
  uuid: ^4.3.3
  timeago: ^3.6.0
  url_launcher: ^6.2.3
  connectivity_plus: ^5.0.2

  # Pagination
  infinite_scroll_pagination: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
