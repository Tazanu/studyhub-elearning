<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWA Icon Generator - StudyHub</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background: #0a0a0a;
            color: #f0f0f0;
        }
        h1 { color: #0066ff; }
        button {
            background: linear-gradient(135deg, #0052cc, #0066ff);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            margin: 10px 5px;
        }
        button:hover { transform: translateY(-2px); }
        .preview { margin: 20px 0; }
        canvas { border: 2px solid #333; margin: 10px; }
        .status { margin: 20px 0; padding: 12px; background: #141414; border-radius: 8px; }
    </style>
</head>
<body>
    <h1>🎨 StudyHub PWA Icon Generator</h1>
    <p>This tool converts the favicon.svg to the required PWA PNG icons.</p>
    
    <div class="status" id="status">Ready to generate icons...</div>
    
    <button onclick="generateAllIcons()">Generate All Icons</button>
    
    <div class="preview" id="preview"></div>
    
    <script>
        async function loadSVG() {
            const response = await fetch('/favicon.svg');
            const svgText = await response.text();
            return svgText;
        }

        function svgToCanvas(svgText, size, bgColor = null) {
            return new Promise((resolve, reject) => {
                const canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext('2d');
                
                // Add background if specified (for apple-touch-icon)
                if (bgColor) {
                    ctx.fillStyle = bgColor;
                    ctx.fillRect(0, 0, size, size);
                }
                
                const img = new Image();
                const blob = new Blob([svgText], { type: 'image/svg+xml' });
                const url = URL.createObjectURL(blob);
                
                img.onload = () => {
                    ctx.drawImage(img, 0, 0, size, size);
                    URL.revokeObjectURL(url);
                    resolve(canvas);
                };
                img.onerror = reject;
                img.src = url;
            });
        }

        function downloadCanvas(canvas, filename) {
            canvas.toBlob(blob => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                a.click();
                URL.revokeObjectURL(url);
            }, 'image/png');
        }

        async function generateAllIcons() {
            const statusEl = document.getElementById('status');
            const previewEl = document.getElementById('preview');
            previewEl.innerHTML = '';
            
            try {
                statusEl.innerHTML = '⏳ Loading SVG...';
                const svgText = await loadSVG();
                
                const icons = [
                    { size: 192, name: 'pwa-192x192.png', bg: null },
                    { size: 512, name: 'pwa-512x512.png', bg: null },
                    { size: 180, name: 'apple-touch-icon.png', bg: '#0a0a0a' }
                ];
                
                for (const icon of icons) {
                    statusEl.innerHTML = `⏳ Generating ${icon.name}...`;
                    const canvas = await svgToCanvas(svgText, icon.size, icon.bg);
                    
                    // Add to preview
                    const container = document.createElement('div');
                    container.style.display = 'inline-block';
                    container.style.margin = '10px';
                    container.style.textAlign = 'center';
                    
                    const preview = document.createElement('canvas');
                    preview.width = 100;
                    preview.height = 100;
                    const previewCtx = preview.getContext('2d');
                    previewCtx.drawImage(canvas, 0, 0, 100, 100);
                    
                    const label = document.createElement('div');
                    label.textContent = icon.name;
                    label.style.fontSize = '12px';
                    label.style.marginTop = '8px';
                    
                    container.appendChild(preview);
                    container.appendChild(label);
                    previewEl.appendChild(container);
                    
                    // Auto-download
                    downloadCanvas(canvas, icon.name);
                }
                
                statusEl.innerHTML = '✅ Success! All icons generated and downloaded. Move them to the public/ folder.';
                statusEl.style.background = '#047857';
            } catch (error) {
                statusEl.innerHTML = '❌ Error: ' + error.message;
                statusEl.style.background = '#7f1d1d';
                console.error(error);
            }
        }
    </script>
</body>
</html>
