<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0052cc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" fill="url(#bgGradient)" rx="80"/>
  <!-- Graduation cap icon simplified -->
  <g transform="translate(256,256)">
    <!-- Cap top -->
    <path d="M -120,-60 L 0,-100 L 120,-60 L 0,-20 Z" fill="white" opacity="0.95"/>
    <!-- Cap base -->
    <path d="M -120,-60 L -120,0 L 0,40 L 120,0 L 120,-60" fill="white" opacity="0.85"/>
    <!-- Tassel -->
    <circle cx="140" cy="-70" r="12" fill="white" opacity="0.9"/>
    <line x1="130" y1="-65" x2="140" y2="-58" stroke="white" stroke-width="3" opacity="0.9"/>
    <!-- StudyHub initial "S" -->
    <text x="-45" y="100" font-family="'Space Grotesk', sans-serif" font-size="140" font-weight="700" fill="white" opacity="0.95">S</text>
  </g>
</svg>
